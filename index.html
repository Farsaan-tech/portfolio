<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Farsaan Siddiqui Syed - DevOps Engineer Portfolio">
  <title>Farsaan Siddiqui Syed | Portfolio</title>
  <style>
    html, body {
      margin: 0;
      min-height: 100%;
      background: #0d1117;
      color: #e6e6e6;
      font-family: Arial, sans-serif;
    }
    .loading {
      min-height: 100vh;
      display: grid;
      place-items: center;
      text-align: center;
      padding: 20px;
      box-sizing: border-box;
    }
  </style>
  <script>
    (function () {
      // Use screen width rather than user-agent detection.
      // This works reliably across Android, iPhone, tablets and desktop browsers.
      var isMobile = window.matchMedia("(max-width: 768px)").matches;
      window.location.replace(isMobile ? "mobile.html" : "desktop.html");
    })();
  </script>
</head>
<body>
  <main class="loading">
    <p>Opening portfolio...</p>
  </main>
  <noscript>
    <p style="text-align:center">
      JavaScript is disabled. Open
      <a href="desktop.html">Desktop version</a> or
      <a href="mobile.html">Mobile version</a>.
    </p>
  </noscript>
</body>
</html>
